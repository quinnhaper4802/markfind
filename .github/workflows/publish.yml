name: Publish

# Publishes to PyPI when a version tag is pushed, using trusted publishing, so
# no token is stored. See "Releasing" in docs/development.md for the setup.
# A pull request that changes this file runs everything except the upload.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/publish.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Install each file in a clean virtualenv and run it
        run: |
          for file in dist/*.whl dist/*.tar.gz; do
            rm -rf /tmp/clean
            python -m venv /tmp/clean
            /tmp/clean/bin/pip install --quiet "$file"
            /tmp/clean/bin/markfind --version
            # The web interface's files must ship as package data.
            /tmp/clean/bin/python -c "from markfind.server import _load_static; _load_static()"
          done
      - name: The tag must match the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/markfind-$version-py3-none-any.whl"
          test "$(/tmp/clean/bin/markfind --version)" = "markfind $version"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # lets PyPI verify this workflow; replaces a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
