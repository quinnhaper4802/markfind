name: CI

on:
  push:
  pull_request:
    # Pushes to this repo's branches already run CI; this covers PRs from forks.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Every job skips PR runs for branches of this repo; their push run already
# reports its checks on the pull request.
jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check SQLite FTS5
        run: >-
          python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version);
          sqlite3.connect(':memory:').execute('CREATE VIRTUAL TABLE t USING fts5(x)')"
      - name: Run tests
        run: python -m pytest -v
      - name: Probe real macOS (temporary)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          DB="$RUNNER_TEMP/probe.sqlite"
          open -ga Safari; sleep 10
          osascript -e 'tell application "Safari" to add reading list item "https://sqlite.org/fts5.html" with title "SQLite FTS5"'; echo "add item exit $?"
          sleep 45
          osascript -e 'quit app "Safari"'; echo "quit exit $?"
          sleep 10
          ls -la ~/Library/Safari/Bookmarks.plist; echo "ls exit $?"
          file ~/Library/Safari/Bookmarks.plist
          plutil -p ~/Library/Safari/Bookmarks.plist | head -70
          markfind --db "$DB" sync --list; echo "sync --list exit $?"
          markfind --db "$DB" sync --no-fetch; echo "sync exit $?"
          markfind --db "$DB" list
          sudo -n true && echo "has sudo"
          python -c "import os;print(open(os.path.expanduser('~/Library/Safari/Bookmarks.plist'),'rb').read(8))"; echo "read exit $?"

  browser:
    name: Browser tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[browser]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest -v tests_browser

  build:
    name: Build package
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/markfind --version
          # The web interface's files must ship as package data.
          /tmp/wheel-env/bin/python -c "from markfind.server import _load_static; _load_static()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
