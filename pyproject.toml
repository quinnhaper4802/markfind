[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "markfind"
version = "0.1.0"
description = "Full-text search over your own browser bookmarks, stored locally in SQLite."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Alcides1123" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["bookmarks", "search", "sqlite", "fts5", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
markfind = "markfind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
