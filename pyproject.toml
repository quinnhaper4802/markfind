[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "markfind"
version = "0.3.0"
description = "Full-text search over your own browser bookmarks, stored locally in SQLite."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Alcides1123" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["bookmarks", "search", "sqlite", "fts5", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Alcides1123/markfind"
Documentation = "https://github.com/Alcides1123/markfind/tree/main/docs"
Issues = "https://github.com/Alcides1123/markfind/issues"
Changelog = "https://github.com/Alcides1123/markfind/blob/main/CHANGES.md"

[project.optional-dependencies]
# Index PDF bookmarks.
pdf = ["pypdf>=4"]
# Verify HTTPS through the operating system; see "SSL certificate errors" in the README.
truststore = ["truststore>=0.10"]
dev = ["pytest>=8", "ruff>=0.15", "pypdf>=4", "truststore>=0.10"]
# Browser tests for the web interface (tests_browser/); see docs/development.md.
browser = ["pytest>=8", "playwright>=1.40"]

[project.scripts]
markfind = "markfind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
markfind = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
